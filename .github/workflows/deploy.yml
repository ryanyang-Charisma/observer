name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Railway project config
        run: |
          mkdir -p .railway
          cat > .railway/config.json << 'EOF'
          {
            "projectId": "17630808-22fa-43ec-b29a-2747bed2081d",
            "environment": "1f921133-446f-43c7-b918-2b00c1e71686",
            "serviceId": "dc27ca09-e277-486a-9b22-4e8a06c0d683"
          }
          EOF

      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway whoami
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
